apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helpdesk.fullname" . }}-secret
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  DATABASE_USERNAME: {{ .Values.secrets.databaseUsername | quote }}
  DATABASE_PASSWORD: {{ .Values.secrets.databasePassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
