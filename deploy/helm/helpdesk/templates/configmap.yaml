apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helpdesk.fullname" . }}-config
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: "prod"
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  JWT_EXPIRATION_MINUTES: {{ .Values.config.jwtExpirationMinutes | quote }}
