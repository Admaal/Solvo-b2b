spring.application.name=helpdesk-backend

server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/helpdesk}
spring.datasource.username=${DATABASE_USERNAME:helpdesk}
spring.datasource.password=${DATABASE_PASSWORD:helpdesk}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

helpdesk.jwt.secret=${JWT_SECRET:change-me-in-production-use-at-least-32-chars!!}
helpdesk.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

helpdesk.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
