name: Keep-alive demo API

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: GET /actuator/health
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        env:
          HEALTH_URL: ${{ vars.DEMO_API_HEALTH_URL || secrets.DEMO_API_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "DEMO_API_HEALTH_URL no configurada — ping omitido."
            exit 0
          fi
          # Cold start de la JVM en Render free ~2 min; un curl de 90s falla y el servicio sigue dormido.
          for i in $(seq 1 15); do
            if curl -fsS --max-time 20 "$HEALTH_URL"; then
              echo "health OK (intento $i)"
              exit 0
            fi
            echo "intento $i fallido; reintento en 15s"
            sleep 15
          done
          echo "health no respondió tras el arranque en frío"
          exit 1
